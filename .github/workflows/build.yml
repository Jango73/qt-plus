name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/linux/deps.sh

      - name: Build qt-plus
        run: ./scripts/linux/build.sh --release

      - name: Run tests
        run: |
          QT_QPA_PLATFORM=offscreen ./build-release/test/qt-plus-test
